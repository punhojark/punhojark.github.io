  content: >
    Our paper, **Interpretable geometry sensitivity for inverse design of integrated photonics**, was selected as an
    **Editor's Pick** in *APL Engineering Physics*.
    [Read the paper](https://doi.org/10.1063/5.0327107).
- date_label: May 2026
  content: >
    At **CLEO 2026 in Charlotte, NC**, we presented two papers: [interpretable inverse design via pixel-level sensitivity](https://opg.optica.org/abstract.cfm?uri=CLEO_FS-2026-JW1.130) and [etch-free III-nitride photonics via bottom-up selective-area growth](https://opg.optica.org/abstract.cfm?uri=CLEO_SI-2026-STH4E.6).
